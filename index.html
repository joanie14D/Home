<!DOCTYPE html>
<html lang="fr" xmlns:xlink="http://www.w3.org/1999/xlink">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Maison">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Maison</title>
<style>
:root{--bg:#efe8e0;--panel:#f8f4ee;--panel2:#e8dfd4;--line:#e0d5c8;--text:#3a322b;--muted:#8f8174;--ink:#26221f;--cal:#5b7577;--light:#c48a57;--rec:#869478;--tim:#c27458;--acc:#5b7577;--serif:Georgia,"Times New Roman",serif;--type:"American Typewriter","Courier New",Courier,monospace}
*{box-sizing:border-box;-webkit-tap-highlight-color:rgba(0,0,0,0)}
html,body{margin:0;height:100%;overflow:hidden;background:#efe8e0;background:var(--bg);color:var(--text);font-family:-apple-system,"Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%}
input,textarea,select,pre,.sel{-webkit-user-select:text;user-select:text}
button{font-family:inherit;cursor:pointer;-webkit-appearance:none;touch-action:manipulation}
h1,h2,h3{margin:0;font-weight:600}
h1,h2{font-family:var(--serif);font-weight:400}
.view{position:fixed;top:0;left:0;right:0;bottom:0;display:none;background:var(--bg)}
.view.on{display:block}
body.standalone .view{top:20px}
#v-cal{--acc:var(--cal)} #v-lights{--acc:var(--light)} #v-rec{--acc:var(--rec)} #v-timer{--acc:var(--tim)}
.blobs{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none}

/* Barre du haut */
.bar{position:absolute;top:0;left:0;right:0;height:64px;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;padding:0 12px;background:var(--panel);border-bottom:1px solid var(--line)}
.bar .title{-webkit-flex:1;flex:1;font-family:var(--serif);font-size:25px;margin-left:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .title small{font-family:var(--type);font-size:14px;color:var(--muted);margin-left:10px}
.vbody{position:absolute;top:64px;left:0;right:0;bottom:0;overflow:hidden}
.btn{background:var(--panel2);color:var(--text);border:0;border-radius:14px;font-size:18px;padding:0 18px;height:46px;margin-left:8px;line-height:46px;white-space:nowrap}
.btn:active,.tile:active,.lbtn:active,.preset:active{opacity:.55}
.btn.accent{background:var(--acc);color:#fff;font-weight:600}
.btn.ghost{background:transparent;color:var(--muted)}
.btn.danger{background:#f1dcd3;color:#a8503a}
.btn.back{margin-left:0;color:var(--acc);background:transparent;font-size:20px;padding:0 10px;font-family:var(--type)}
.btn.sq{width:46px;padding:0;text-align:center;font-size:24px}
.status{font-family:var(--type);font-size:13px;color:var(--muted);margin:0 6px;max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.status.err{color:#a8503a}

/* Accueil */
.home-left{position:absolute;top:34px;left:40px;width:384px;bottom:30px;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column}
.clock{font-size:84px;font-weight:300;letter-spacing:-2px;line-height:1;color:var(--text)}
.date{font-size:25px;color:#6d6156;margin-top:6px}
.widget{background:rgba(232,223,212,.92);border-radius:28px;margin-top:22px;padding:16px 18px;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center}
.aclock{width:150px;height:150px;-webkit-flex:none;flex:none}
.mcal{-webkit-flex:1;flex:1;margin-left:12px}
.mcal .mt{font-family:var(--serif);font-weight:700;font-size:17px;letter-spacing:1px;text-align:right;text-transform:uppercase;margin-bottom:4px}
.mcal table{width:100%;border-collapse:collapse;font-family:var(--serif);font-size:14px;font-weight:700}
.mcal td{text-align:center;height:20px;padding:0;position:relative}
.mcal td.wd{font-family:var(--type);font-weight:400;font-size:11px;color:var(--muted)}
.mcal td.td span{background:var(--ink);color:#fff;border-radius:5px;padding:1px 3px}
.mcal td.hasev:after{content:"";position:absolute;left:50%;bottom:0;width:4px;height:4px;margin-left:-2px;border-radius:2px;background:var(--tim)}
.agenda{background:rgba(248,244,238,.94);border-radius:28px;padding:14px 22px;margin-top:16px;overflow:hidden;-webkit-flex:1;flex:1;min-height:0}
.agenda .ag-h{font-family:var(--type);font-size:13px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin:8px 0 4px}
.ag-row{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;padding:6px 0;font-size:18px}
.ag-row .dot{width:10px;height:10px;border-radius:5px;margin-right:12px;-webkit-flex:none;flex:none}
.ag-row .t{color:var(--muted);width:84px;-webkit-flex:none;flex:none;font-size:16px;font-family:var(--type)}
.ag-row .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ag-empty{color:var(--muted);font-size:17px;line-height:1.45;padding:4px 0}
.tiles{position:absolute;left:470px;right:34px;top:64px;display:-webkit-flex;display:flex;-webkit-justify-content:space-between;justify-content:space-between}
.tile{width:120px;text-align:center;cursor:pointer}
.tile .ic{width:112px;height:112px;margin:0 auto;border-radius:28px;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;box-shadow:0 6px 16px rgba(90,70,50,.14)}
.tile svg,.ico{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.tile .ic svg{width:58px;height:58px;stroke:#fff}
.tile .ic.white{background:#fffdfa}
.tile .ic.white svg{stroke:#b98a68}
.tile .name{font-family:var(--type);font-size:17px;margin-top:12px}
.tile .sub{font-size:13px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.quote{position:absolute;left:470px;top:280px;width:340px;min-height:140px;cursor:pointer;border-radius:26px;background:#6f7f78;color:#f5ede4;padding:18px 20px;font-family:var(--serif);font-style:italic;font-size:21px;line-height:1.3;box-shadow:0 6px 16px rgba(90,70,50,.12)}
.qadd{position:absolute;top:10px;right:10px;width:38px;height:38px;border-radius:19px;border:0;background:rgba(255,255,255,.2);color:#fff;font-size:24px;line-height:36px;padding:0;font-family:-apple-system,Helvetica,sans-serif;font-style:normal}
.qmine{position:absolute;right:20px;bottom:14px;font-style:normal;font-size:15px;opacity:.85}
.quote{padding-right:54px !important}
.quote small{display:block;font-family:var(--type);font-style:normal;font-size:12px;margin-top:12px;opacity:.85;line-height:1.4}
.shelf{position:absolute;right:20px;bottom:24px;width:560px;height:248px}
@media (orientation:portrait){
  .home-left{width:auto;right:40px;bottom:auto;height:560px}
  .tiles{left:40px;right:40px;top:auto;bottom:330px}
  .quote{display:none}
  .shelf{left:50%;margin-left:-280px;bottom:20px}
}

/* Calendrier */
.wk-head{display:-webkit-flex;display:flex;height:60px;border-bottom:1px solid var(--line);background:var(--panel)}
.gut{width:56px;-webkit-flex:none;flex:none}
.wk-day{-webkit-flex:1;flex:1;text-align:center;padding-top:5px}
.wk-day span{display:block;font-family:var(--type);font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
.wk-day b{display:inline-block;font-family:var(--serif);font-size:23px;font-weight:700;min-width:36px;line-height:32px;border-radius:9px;padding:0 4px}
.wk-day.today span{color:var(--ink)}
.wk-day.today b{background:var(--ink);color:#fff}
.wk-ad{display:-webkit-flex;display:flex;border-bottom:1px solid var(--line);max-height:110px;overflow:hidden;background:var(--panel)}
.wk-ad .gut{font-family:var(--type);font-size:11px;color:var(--muted);text-align:right;padding:7px 8px 0 0}
.ad-col{-webkit-flex:1;flex:1;min-width:0;padding:3px;border-left:1px solid var(--line)}
.chip{font-size:13px;border-radius:7px;padding:4px 6px;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff;cursor:pointer}
.wk-scroll{position:relative;overflow-y:scroll;-webkit-overflow-scrolling:touch}
.wk-grid{display:-webkit-flex;display:flex;position:relative}
.hours{width:56px;-webkit-flex:none;flex:none;position:relative}
.hours div{position:absolute;right:8px;font-family:var(--type);font-size:11px;color:var(--muted);margin-top:-8px}
.wk-col{-webkit-flex:1;flex:1;min-width:0;position:relative;border-left:1px solid var(--line);background-image:linear-gradient(to bottom,#e2d8cc 1px,rgba(0,0,0,0) 1px);background-size:100% 46px}
.wk-col.today{background-color:rgba(255,253,249,.75)}
.ev{position:absolute;border-radius:8px;padding:3px 6px;font-size:13px;line-height:1.25;overflow:hidden;color:#fff;cursor:pointer;border:1px solid var(--bg)}
.ev b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev i{font-style:normal;opacity:.9;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.now{position:absolute;left:-1px;right:0;height:2px;background:var(--tim);z-index:5}
.now:before{content:"";position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:5px;background:var(--tim)}
.gframe{border:0;width:100%;height:100%;background:#fff}
.empty{text-align:center;padding:50px 60px;color:var(--muted);font-size:20px;line-height:1.5}
.empty b{color:var(--text);font-family:var(--serif);font-weight:400;font-size:30px;display:block;margin-bottom:10px}
.empty .btn{margin-top:22px}
.empty svg{width:380px;height:170px;display:block;margin:0 auto 20px}

/* Lumières */
.lgrid{position:absolute;top:0;left:0;right:0;bottom:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:18px;display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;-webkit-align-content:flex-start;align-content:flex-start}
.lcard{width:23%;width:calc(25% - 16px);margin:8px;background:var(--panel);border-radius:28px;padding:22px 16px 16px;text-align:center;box-shadow:0 4px 14px rgba(90,70,50,.07)}
.lcard.lit{background:radial-gradient(circle at 50% 28%,rgba(232,170,110,.42),#f8f4ee 64%)}
.lcard svg{width:76px;height:76px;stroke:#b6a899}
.lcard.lit svg{stroke:var(--light);fill:rgba(232,170,110,.35)}
.lcard.scene svg{stroke:var(--cal)}
.lcard .ln{font-family:var(--serif);font-size:23px;margin:8px 0 14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow{display:block;text-align:center;font-size:0;white-space:nowrap}
.lbtn{display:inline-block;vertical-align:top;width:44%;height:60px;padding:0;margin:0 3%;border:0;border-radius:16px;font-size:22px;font-weight:700;letter-spacing:2px;text-align:center;background:var(--panel2);color:var(--text);font-family:var(--type)}
.lbtn.wide{width:94%}
.lbtn.off{background:var(--ink);color:#f5ede4}
.lbtn.on{background:var(--light);color:#fff;font-weight:600}
.lcard.scene .lbtn.on{background:var(--cal)}
.lnote{width:100%;color:var(--muted);font-size:15px;padding:10px 12px 0;line-height:1.5}

/* Recettes */
.rec-side{position:absolute;left:0;top:0;bottom:0;width:320px;background:var(--panel);border-right:1px solid var(--line)}
.rs-top{position:absolute;top:0;left:0;right:0;height:124px;padding:14px 14px 0}
.search{width:100%;height:46px;border-radius:14px;border:0;background:var(--panel2);color:var(--text);font-size:18px;padding:0 14px;-webkit-appearance:none}
.chips{white-space:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;margin-top:12px;padding-bottom:8px}
.cchip{display:inline-block;padding:0 14px;height:38px;line-height:38px;border-radius:19px;background:var(--panel2);font-size:15px;margin-right:6px;cursor:pointer;font-family:var(--type)}
.cchip.on{background:var(--rec);color:#fff}
.rs-list{position:absolute;top:124px;bottom:78px;left:0;right:0;overflow-y:auto;-webkit-overflow-scrolling:touch;border-top:1px solid var(--line)}
.ritem{padding:14px 18px;border-bottom:1px solid var(--line);cursor:pointer}
.ritem.on{background:#eef0e8;box-shadow:inset 4px 0 0 var(--rec)}
.ritem b{display:block;font-family:var(--serif);font-size:20px;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ritem span{font-size:13px;color:var(--muted);font-family:var(--type)}
.rs-bot{position:absolute;bottom:0;left:0;right:0;height:78px;padding:16px 14px;border-top:1px solid var(--line);display:-webkit-flex;display:flex}
.rs-bot .btn{margin:0 4px;-webkit-flex:1;flex:1;padding:0 8px}
.rec-main{position:absolute;left:320px;right:0;top:0;bottom:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:26px 34px 60px}
.rd-head{display:-webkit-flex;display:flex;-webkit-align-items:flex-start;align-items:flex-start}
.rd-head>div:first-child{-webkit-flex:1;flex:1}
.rd-cat{color:var(--rec);text-transform:uppercase;letter-spacing:1.5px;font-size:13px;font-family:var(--type)}
.rd-head h1{font-size:40px;margin:4px 0 8px;line-height:1.1}
.rd-meta{color:var(--muted);font-size:17px;font-family:var(--type)}
.rd-meta span{margin-right:20px;display:inline-block}
.rd-cols{display:-webkit-flex;display:flex;margin-top:24px}
.rd-ing{width:38%;padding-right:26px}
.rd-steps{-webkit-flex:1;flex:1}
.rd-cols h3,.rd-notes h3{font-family:var(--type);font-weight:400;font-size:14px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin-bottom:10px}
.rd-ing ul,.rd-steps ol{list-style:none;margin:0;padding:0}
.rd-ing li{font-size:19px;padding:10px 0 10px 40px;position:relative;border-bottom:1px solid var(--line);cursor:pointer;line-height:1.35}
.rd-ing li .box{position:absolute;left:2px;top:10px;width:26px;height:26px;border-radius:8px;border:2px solid #c9bcae;background:#fffdfa}
.rd-ing li.done{color:var(--muted);text-decoration:line-through}
.rd-ing li.done .box{background:var(--rec);border-color:var(--rec)}
.rd-steps li{font-size:19px;line-height:1.5;padding:12px 14px 12px 54px;position:relative;border-radius:16px;margin-bottom:8px;background:var(--panel);cursor:pointer}
.rd-steps li .num{position:absolute;left:12px;top:12px;width:30px;height:30px;border-radius:15px;background:var(--panel2);text-align:center;line-height:30px;font-size:16px;font-family:var(--serif);font-weight:700}
.rd-steps li.done{opacity:.45}
.rd-steps li.done .num{background:var(--rec);color:#fff}
.tlink{color:#fff;background:var(--tim);border-radius:8px;padding:1px 7px;font-weight:600;white-space:nowrap;cursor:pointer}
.tlink:before{content:"⏱ "}
.rd-notes{margin-top:26px;background:var(--panel2);border-radius:18px;padding:16px 20px;font-size:18px;line-height:1.5}
.rd-foot{margin-top:30px;text-align:right}
.form .field{margin-bottom:16px}
.field label{display:block;font-family:var(--type);font-size:13px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.field label em{text-transform:none;letter-spacing:0;font-style:normal}
.inp{width:100%;border:1px solid var(--line);border-radius:14px;background:#fffdfa;color:var(--text);font-size:18px;padding:11px 14px;font-family:inherit;-webkit-appearance:none}
textarea.inp{min-height:170px;line-height:1.45;resize:vertical}
select.inp{height:46px}
.frow{display:-webkit-flex;display:flex;margin:0 -8px}
.frow>.field{-webkit-flex:1;flex:1;margin-left:8px;margin-right:8px}

/* Minuteur */
.tm-left{position:absolute;left:0;top:0;bottom:0;width:470px;padding:18px 20px;border-right:1px solid var(--line);overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--panel)}
.tm-left h3{font-family:var(--type);font-weight:400;font-size:13px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin:6px 0 10px}
.presets{display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;margin:0 -5px 14px}
.preset{width:22%;width:calc(25% - 10px);margin:5px;height:62px;border:0;border-radius:16px;background:var(--panel2);color:var(--text);font-size:24px;font-family:var(--serif);font-weight:700}
.preset small{font-size:13px;color:var(--muted);margin-left:2px;font-family:var(--type);font-weight:400}
.cdisp{font-size:64px;font-weight:300;text-align:center;margin:4px 0 8px;letter-spacing:-1px}
.adds{display:-webkit-flex;display:flex;margin:0 -4px 10px}
.adds .btn{-webkit-flex:1;flex:1;margin:0 4px;padding:0}
.tm-right{position:absolute;left:470px;right:0;top:0;bottom:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:18px 20px}
.tcard{background:var(--panel);border-radius:26px;padding:16px 20px 18px;margin-bottom:14px;position:relative;overflow:hidden;box-shadow:0 4px 14px rgba(90,70,50,.07)}
.tcard .tl{font-family:var(--type);font-size:18px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:60px}
.tcard .big{font-size:64px;font-weight:300;line-height:1.1;letter-spacing:-1px}
.tcard.paused .big{color:var(--muted)}
.tcard.rang{background:#f3ddd3}
.tcard.rang .big{color:#a8503a}
.pbar{height:6px;border-radius:3px;background:var(--panel2);margin:8px 0 12px;overflow:hidden}
.pbar div{height:6px;background:var(--tim);width:100%}
.trow{display:-webkit-flex;display:flex;margin:0 -4px}
.trow .btn{-webkit-flex:1;flex:1;margin:0 4px}
.tdel{position:absolute;top:12px;right:12px;margin:0}
#tbar{position:fixed;right:14px;bottom:14px;z-index:40;display:none;cursor:pointer}
#tbar .pill{display:inline-block;margin-left:8px;background:var(--ink);color:#f5ede4;border-radius:24px;padding:0 18px;height:48px;line-height:48px;font-size:18px;font-family:var(--type);box-shadow:0 6px 20px rgba(60,40,20,.25)}
#tbar .pill.rang{background:var(--tim);color:#fff}

/* Alarme */
#alarm{position:fixed;top:0;left:0;right:0;bottom:0;z-index:90;display:none;background:#c27458;color:#fff;text-align:center;padding-top:120px;-webkit-animation:flash 1.2s infinite;animation:flash 1.2s infinite}
#alarm.on{display:block}
@-webkit-keyframes flash{0%,100%{background:#c27458}50%{background:#8a4b35}}
@keyframes flash{0%,100%{background:#c27458}50%{background:#8a4b35}}
#alarm .a1{font-size:32px;opacity:.9;font-family:var(--type)}
#alarm .a2{font-size:76px;font-family:var(--serif);margin:14px 40px 50px;line-height:1.1}
#alarm .btn{height:84px;font-size:30px;padding:0 50px;border-radius:24px;margin:0 10px;background:rgba(255,255,255,.22);color:#fff}
#alarm .btn.stop{background:#fff;color:#8a4b35;font-weight:700}

/* Fenêtre modale */
#modal{position:fixed;top:0;left:0;right:0;bottom:0;z-index:60;background:rgba(58,50,43,.45);display:none}
#modal.on{display:block}
.sheet{position:absolute;top:30px;bottom:30px;left:50%;width:820px;margin-left:-410px;background:#f8f4ee;border-radius:28px;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:22px 26px 40px;box-shadow:0 20px 60px rgba(60,40,20,.25)}
.sh-head{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;margin-bottom:18px}
.sh-head h2{-webkit-flex:1;flex:1;font-size:27px}
.sheet h3{font-family:var(--type);font-weight:400;font-size:14px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin:22px 0 10px}
.row{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;margin-bottom:10px;background:var(--panel2);border-radius:16px;padding:8px}
.row .inp{margin-right:8px}
.row .btn{margin-left:0}
.lrow2{display:block;padding:10px}
.lrow2 .top{display:-webkit-flex;display:flex;margin-bottom:8px}
.lrow2 .inp{margin-bottom:0}
.lrow2 .urls{display:-webkit-flex;display:flex}
.lrow2 .urls .inp{-webkit-flex:1;flex:1;font-size:15px}
.seg label{display:inline-block;background:var(--panel2);border-radius:14px;padding:12px 16px;margin:0 8px 8px 0;font-size:17px}
.seg input{margin-right:8px;-webkit-transform:scale(1.3);transform:scale(1.3)}
.help{background:#efe7dd;border-radius:16px;padding:14px 18px;color:#5e5349;font-size:16px;line-height:1.55;margin-top:10px}
.help ol{margin:6px 0;padding-left:22px}
.help b{color:var(--text)}
.help pre{background:#2b2622;border-radius:10px;padding:12px;font-size:13px;overflow-x:auto;color:#f0e6da;white-space:pre}
.dtl{font-size:20px;line-height:1.6}
.dtl .muted{color:var(--muted)}

#toast{position:fixed;left:50%;bottom:30px;width:520px;margin-left:-260px;text-align:center;z-index:95;background:var(--ink);color:#f5ede4;border-radius:18px;padding:14px 18px;font-size:18px;opacity:0;-webkit-transform:translateY(20px);transform:translateY(20px);-webkit-transition:all .25s;transition:all .25s;pointer-events:none}
#toast.show{opacity:1;-webkit-transform:none;transform:none}

/* Miroir photo */
.quote{width:300px !important}
.mirror{position:absolute;left:806px;top:252px;width:196px;height:294px;cursor:pointer;-webkit-touch-callout:none;-webkit-filter:drop-shadow(0 10px 14px rgba(70,45,25,.28));filter:drop-shadow(0 10px 14px rgba(70,45,25,.28))}
.mirror .mi{opacity:0;-webkit-transition:opacity 1.6s;transition:opacity 1.6s}
.mirror .mi.on{opacity:1}
@media (orientation:portrait){.mirror{display:none}}
.mirror{-webkit-touch-callout:none}
.cropwrap{display:-webkit-flex;display:flex;-webkit-align-items:flex-start;align-items:flex-start}
.cropbox{position:relative;width:250px;height:500px;overflow:hidden;background:#3b332c;border-radius:4px;-webkit-flex:none;flex:none;touch-action:none;cursor:move}
.cropbox img{position:absolute;top:0;left:0;-webkit-transform-origin:0 0;transform-origin:0 0;max-width:none;pointer-events:none}
.cropbox svg{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none}
.cropside{-webkit-flex:1;flex:1;margin-left:28px}
.cropside .step{font-family:var(--type);font-size:13px;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.cropside p{font-size:17px;line-height:1.5;color:#5e5349;margin:10px 0 18px}
.zrow{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;margin-bottom:12px}
.zrow .btn{margin:0 8px 0 0;width:56px;font-size:26px;padding:0;text-align:center}
.zrow span{font-family:var(--type);color:var(--muted);font-size:14px}
.cropside .btn.blk{display:block;width:100%;margin:0 0 10px;text-align:center}
.thumbs{margin-top:18px;white-space:nowrap}
.thumbs img{width:44px;height:88px;object-fit:cover;border-radius:22px 22px 3px 3px;margin-right:6px;opacity:.45;border:2px solid transparent}
.thumbs img.cur{opacity:1;border-color:var(--cal)}
.thumbs img.done{opacity:1}

.pgrid{margin:4px -6px 0}
.pth{display:inline-block;position:relative;width:76px;height:152px;margin:6px;vertical-align:top;cursor:pointer}
.pth img{width:100%;height:100%;object-fit:cover;border-radius:38px 38px 4px 4px;border:3px solid #c9a56a}
.pth .x{position:absolute;top:-6px;right:-6px;width:32px;height:32px;border-radius:16px;border:0;background:#a8503a;color:#fff;font-size:16px;padding:0;line-height:32px}
.pick{position:relative;overflow:hidden;display:inline-block}
.pick input{position:absolute;top:0;left:0;width:100%;height:100%;opacity:0;font-size:200px;cursor:pointer}
</style>

<script>
(function () {
  'use strict';

  /* ---------- Outils ---------- */
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function load(k, def) { try { var v = localStorage.getItem('maison.' + k); return v ? JSON.parse(v) : def; } catch (e) { return def; } }
  function save(k, v) { try { localStorage.setItem('maison.' + k, JSON.stringify(v)); return true; } catch (e) { return false; } }
  function each(list, fn) { for (var i = 0; i < list.length; i++) fn(list[i], i); }
  function matches(el, sel) { var f = el.matches || el.webkitMatchesSelector || el.msMatchesSelector; return f ? f.call(el, sel) : false; }
  function up(el, sel) { while (el && el.nodeType === 1) { if (matches(el, sel)) return el; el = el.parentNode; } return null; }
  function on(id, fn) { var el = $(id); if (el) el.onclick = fn; }
  function norm(s) { s = String(s || '').toLowerCase(); return s.normalize ? s.normalize('NFD').replace(/[̀-ͯ]/g, '') : s; }
  function ucfirst(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
  function hm(d) { return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
  function addDays(d, n) { return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n, d.getHours(), d.getMinutes(), d.getSeconds()); }
  function dayStart(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
  function dayKey(d) { return d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate(); }
  function hexRgba(hex, a) { var n = parseInt(hex.slice(1), 16); return 'rgba(' + (n >> 16 & 255) + ',' + (n >> 8 & 255) + ',' + (n & 255) + ',' + a + ')'; }

  var JOURS = ['dimanche', 'lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi'];
  var JOURS_C = ['Dim', 'Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam'];
  var MOIS = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];

  if (window.navigator.standalone) document.body.className += ' standalone';

  // iOS : les vues doivent avoir un gestionnaire de clic pour que les touchers sur les <div> soient pris en compte
  each(document.querySelectorAll('.view, #modal, #alarm, #tbar'), function (v) { v.onclick = function () {}; });

  function toast(msg) {
    var t = $('toast'); t.textContent = msg; t.className = 'show';
    clearTimeout(toast.t); toast.t = setTimeout(function () { t.className = ''; }, 2600);
  }

  function openModal(html) { $('modal-body').onclick = null; $('modal-body').innerHTML = html; $('modal').className = 'on'; $('modal-body').scrollTop = 0; }
  function closeModal() { $('modal').className = ''; $('modal-body').innerHTML = ''; }
  $('modal').addEventListener('click', function (e) {
    if (e.target === $('modal') || up(e.target, '[data-close]')) closeModal();
  });

  /* ---------- Navigation ---------- */
  var current = 'home';
  function show(v) {
    each(document.querySelectorAll('.view'), function (el) { el.className = 'view'; });
    $('v-' + v).className = 'view on';
    current = v;
    if (v === 'cal') renderCal(true);
    if (v === 'lights') renderLights();
    if (v === 'rec') renderRecipes();
    if (v === 'timer') renderTimers();
    if (v === 'home') { renderClock(); renderHomeAgenda(); updateTiles(); }
    updateTimerBar();
  }
  document.addEventListener('click', function (e) {
    var g = up(e.target, '[data-go]');
    if (g) show(g.getAttribute('data-go'));
  });

  /* ---------- Accueil ---------- */
  var CITATIONS = [
    ['Par l’amour, tout est possible.', 'Crescent City · Sarah J. Maas'],
    ['La peur et le courage ne sont souvent qu’une seule et même chose.', 'Le Sang et la Cendre · Jennifer L. Armentrout'],
    ['Rien n’est jamais simple. Et quand ça l’est, ça en vaut rarement la peine.', 'Le Sang et la Cendre · Jennifer L. Armentrout'],
    ['Aux étoiles qui écoutent, et aux rêves qui se réalisent.', 'Un palais de colère et de brume · Sarah J. Maas'],
    ['Je n’étais pas un animal de compagnie, ni une poupée. J’étais une survivante, et j’étais forte.', 'Un palais de colère et de brume · Sarah J. Maas'],
    ['Tu pourrais faire trembler les étoiles.', 'Keleana (Throne of Glass) · Sarah J. Maas'],
    ['Si je ne peux pas être meilleure qu’eux, je deviendrai bien pire.', 'Le Prince cruel · Holly Black'],
    ['Un dragon sans son dragonnier est une tragédie. Un dragonnier sans son dragon est mort.', 'Fourth Wing · Rebecca Yarros'],
    ['Pas de deuil. Pas de funérailles.', 'Six of Crows · Leigh Bardugo'],
    ['Il y a toujours un autre secret.', 'Fils-des-Brumes · Brandon Sanderson'],
    ['Un lecteur vit mille vies avant de mourir. Celui qui ne lit jamais n’en vit qu’une.', 'Le Trône de fer · George R. R. Martin'],
    ['Tout ce que nous avons à décider, c’est ce que nous ferons du temps qui nous est imparti.', 'Le Seigneur des Anneaux · J. R. R. Tolkien'],
    ['Tout ce qui est or ne brille pas, tous ceux qui errent ne sont pas perdus.', 'Le Seigneur des Anneaux · J. R. R. Tolkien'],
    ['Même la plus petite personne peut changer le cours de l’avenir.', 'Le Seigneur des Anneaux · J. R. R. Tolkien'],
    ['Si davantage d’entre nous préféraient la nourriture, la gaieté et les chansons à l’or amassé, le monde serait plus joyeux.', 'Le Hobbit · J. R. R. Tolkien'],
    ['Il ne faut pas s’installer dans les rêves en oubliant de vivre.', 'Harry Potter à l’école des sorciers · J. K. Rowling'],
    ['Ce sont nos choix qui montrent ce que nous sommes vraiment, beaucoup plus que nos aptitudes.', 'Harry Potter et la Chambre des secrets · J. K. Rowling'],
    ['Le cirque arrive sans prévenir.', 'Le Cirque des rêves · Erin Morgenstern']
  ];
  var citIdx = -1;
  var myQuotes = load('quotes', []), onlyMine = load('onlyMine', false);
  function quoteSrc(q) { return [q.book, q.author].filter(function (x) { return x; }).join(' · ') || 'Ma lecture'; }
  function allQuotes() {
    var mine = myQuotes.map(function (q) { return [q.t, quoteSrc(q), q.id]; });
    return (onlyMine && mine.length) ? mine : CITATIONS.concat(mine);
  }
  function renderQuote() {
    var list = allQuotes(), c = list[((citIdx % list.length) + list.length) % list.length], len = c[0].length;
    var q = $('quote');
    q.style.fontSize = (len > 160 ? 15 : len > 100 ? 17 : len > 60 ? 19 : 22) + 'px';
    q.innerHTML = '<button class="qadd" title="Mes citations">+</button>' + (c[2] ? '<span class="qmine">♥</span>' : '') +
      '«&nbsp;' + esc(c[0]).replace(/ ([^ ]+)$/, '&nbsp;$1') + '&nbsp;»<small>' + esc(c[1]) + '</small>';
  }
  $('quote').onclick = function (e) {
    if (up(e.target, '.qadd')) { quoteManager(); return; }
    citIdx++; renderQuote();
  };

  function quoteManager() {

  var timers = load('timers', []);

  function tRemain(t) { return t.paused ? t.left : t.end - Date.now(); }
  function fmt(ms) {

    return h ? h + ':' + pad(m) + ':' + pad(x) : pad(m) + ':' + pad(x);

  /* Son de l'alarme : un petit fichier WAV généré, joué en boucle */
  var alarmAudio = null, audioReady = false, ringing = false;
  function makeWav() {
    var rate = 8000, len = Math.floor(rate * 1.6), arr = new Array(len);
    for (var i = 0; i < len; i++) {
      var t = i / rate, p = (t - 0.1) % 0.32, onb = t >= 0.1 && t < 1.1 && p < 0.18;
      var v = onb ? Math.sin(2 * Math.PI * 1046 * t) * 0.9 * Math.min(1, p * 60, (0.18 - p) * 60) : 0;
      arr[i] = String.fromCharCode(Math.round(128 + v * 127));
    }
    function u32(n) { return String.fromCharCode(n & 255, (n >> 8) & 255, (n >> 16) & 255, (n >> 24) & 255); }
    function u16(n) { return String.fromCharCode(n & 255, (n >> 8) & 255); }
    var head = 'RIFF' + u32(36 + len) + 'WAVEfmt ' + u32(16) + u16(1) + u16(1) + u32(rate) + u32(rate) + u16(1) + u16(8) + 'data' + u32(len);
    return 'data:audio/wav;base64,' + btoa(head + arr.join(''));
  }
  function unlockAudio() {
    if (audioReady) return;
    try {
      alarmAudio = alarmAudio || new Audio(makeWav());
      alarmAudio.loop = true;
      if (!ringing) {
        alarmAudio.muted = true;
        var p = alarmAudio.play(); if (p && p.catch) p.catch(function () {});
        setTimeout(function () { if (!ringing) { alarmAudio.pause(); alarmAudio.muted = false; } else alarmAudio.muted = false; }, 60);
      }
      audioReady = true;
    } catch (e) {}
  }
  document.addEventListener('touchend', unlockAudio, false);
  document.addEventListener('click', unlockAudio, false);

  function playAlarm() {
    ringing = true;
    try {
      alarmAudio = alarmAudio || new Audio(makeWav());
      alarmAudio.loop = true; alarmAudio.muted = false; alarmAudio.currentTime = 0;
      var p = alarmAudio.play(); if (p && p.catch) p.catch(function () {});
    } catch (e) {}
  }
  function stopAlarm() { ringing = false; try { if (alarmAudio) alarmAudio.pause(); } catch (e) {} }

  function checkAlarm() {
    var rung = timers.filter(function (t) { return t.rang; });

  /* =====================================================
     MIROIR PHOTO — stockage et import
     ===================================================== */
  var photos = []; // { id, src (photo réduite, pour recadrer), crop (image du miroir), added }
  var photoSpeed = load('photoSpeed', 8);

  // Stockage : IndexedDB (beaucoup de place) ; sinon localStorage (sans la photo source)
  var PStore = (function () {
    var db = null, useLS = false;
    function lsLoad() { return load('photos', []); }
    function lsSave() {
      var ok = save('photos', photos.map(function (p) { return { id: p.id, crop: p.crop, added: p.added }; }));
      if (!ok) toast('⚠️ Plus de place pour les photos : retires-en quelques-unes');
    }
    function open(cb) {
      var idb = null;
      try { idb = window.indexedDB || window.webkitIndexedDB; } catch (e) {}
      if (!idb) { useLS = true; cb(); return; }
      var done = false;
      function fail() { if (!done) { done = true; useLS = true; cb(); } }
      try {
        var rq = idb.open('maison-photos', 1);
        rq.onupgradeneeded = function () { rq.result.createObjectStore('photos', { keyPath: 'id' }); };
        rq.onsuccess = function () { if (!done) { done = true; db = rq.result; cb(); } };
        rq.onerror = fail;
        setTimeout(fail, 4000);
      } catch (e) { fail(); }
    }
    return {
      loadAll: function (cb) {
        open(function () {
          if (useLS) { cb(lsLoad()); return; }
          var out = [];
          try {
            var c = db.transaction('photos', 'readonly').objectStore('photos').openCursor();
            c.onsuccess = function () { var cur = c.result; if (cur) { out.push(cur.value); cur['continue'](); } else cb(out); };
            c.onerror = function () { useLS = true; cb(lsLoad()); };
          } catch (e) { useLS = true; cb(lsLoad()); }
        });
      },
      put: function (p) {
        if (useLS) { lsSave(); return; }
        try { db.transaction('photos', 'readwrite').objectStore('photos').put(p); } catch (e) { useLS = true; lsSave(); }
      },
      del: function (id) {
        if (useLS) { lsSave(); return; }
        try { db.transaction('photos', 'readwrite').objectStore('photos')['delete'](id); } catch (e) { useLS = true; lsSave(); }
      },
      local: function () { return useLS; }
    };
  })();

  // Les photos prises en portrait ont une « orientation » cachée : on vérifie si Safari la gère seul
  var autoRotates = null;
  (function () {
    var t = new Image();
    t.onload = function () { autoRotates = t.width === 1 && t.height === 2; };
    t.onerror = function () { autoRotates = false; };
    t.src = 'data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/4QAiRXhpZgAATU0AKgAAAAgAAQESAAMAAAABAAYAAAAAAAD/2wBDABALDA4MChAODQ4SERATGCgaGBYWGDEjJR0oOjM9PDkzODdASFxOQERXRTc4UG1RV19iZ2hnPk1xeXBkeFxlZ2P/2wBDARESEhgVGC8aGi9jQjhCY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2P/wAARCAABAAIDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4uPk5ebn6Onq8vP09fb3+Pn6/9oADAMBAAIRAxEAPwBtFFFeWeyf/9k=';
  })();
  function exifOrientation(buf) {
    try {
      var v = new DataView(buf);
      if (v.getUint16(0) !== 0xFFD8) return 1;
      var off = 2, len = v.byteLength;
      while (off < len - 4) {
        var mk = v.getUint16(off);
        if (mk === 0xFFE1) {
          if (v.getUint32(off + 4) !== 0x45786966) return 1;

          var ifd = t + v.getUint32(t + 4, little), n = v.getUint16(ifd, little);
          for (var i = 0; i < n; i++) {
            var e = ifd + 2 + i * 12;
            if (v.getUint16(e, little) === 0x0112) return v.getUint16(e + 8, little);
          }
          return 1;
        }
        if ((mk & 0xFF00) !== 0xFF00) break;
        off += 2 + v.getUint16(off + 2);
      }

    return 1;
  }

  // Lit un fichier photo, le remet à l'endroit et le réduit (900 px max) pour le recadrage
  function readPhoto(file, cb) {
    var fr = new FileReader();
    fr.onerror = function () { cb(null); };
    fr.onload = function () {
      var o = autoRotates ? 1 : exifOrientation(fr.result);
      var URLx = window.URL || window.webkitURL, url = URLx.createObjectURL(file), im = new Image();
      im.onerror = function () { URLx.revokeObjectURL(url); cb(null); };
      im.onload = function () {
        var w = im.naturalWidth, h = im.naturalHeight, k = Math.min(1, 900 / Math.max(w, h));
        var dw = Math.round(w * k), dh = Math.round(h * k), swap = o >= 5 && o <= 8;
        var c = document.createElement('canvas'), x = c.getContext('2d');
        c.width = swap ? dh : dw; c.height = swap ? dw : dh;
        switch (o) {
          case 2: x.transform(-1, 0, 0, 1, dw, 0); break;
          case 3: x.transform(-1, 0, 0, -1, dw, dh); break;
          case 4: x.transform(1, 0, 0, -1, 0, dh); break;
          case 5: x.transform(0, 1, 1, 0, 0, 0); break;
          case 6: x.transform(0, 1, -1, 0, dh, 0); break;
          case 7: x.transform(0, -1, -1, 0, dh, dw); break;
          case 8: x.transform(0, -1, 1, 0, 0, dw); break;
        }
        x.drawImage(im, 0, 0, dw, dh);
        URLx.revokeObjectURL(url);
        cb(c.toDataURL('image/jpeg', 0.85));
      };
      im.src = url;
    };
    fr.readAsArrayBuffer(file);
  }

  /* ---------- Miroir : défilement ---------- */
  var SVGNS = 'http://www.w3.org/2000/svg', XLINK = 'http://www.w3.org/1999/xlink';
  var mirIdx = 0, mirTimer = null;
  function setHref(el, v) { el.setAttribute('href', v); el.setAttributeNS(XLINK, 'xlink:href', v); }
  function renderMirror() {
    var g = $('mi-g'); if (!g) return;
    while (g.firstChild) g.removeChild(g.firstChild);
    $('mi-empty').style.display = photos.length ? 'none' : '';
    each(photos, function (p, i) {
      var im = document.createElementNS(SVGNS, 'image');
      im.setAttribute('x', '40'); im.setAttribute('y', '40'); im.setAttribute('width', '120'); im.setAttribute('height', '240');
      im.setAttribute('preserveAspectRatio', 'xMidYMid slice');
      im.setAttribute('class', i === 0 ? 'mi on' : 'mi');
      setHref(im, p.crop);
      g.appendChild(im);
    });
    mirIdx = 0;
    clearInterval(mirTimer);
    if (photos.length > 1) mirTimer = setInterval(nextPhoto, photoSpeed * 1000);
  }
  function nextPhoto() {
    var ims = $('mi-g').getElementsByTagName('image');
    if (ims.length < 2) return;
    ims[mirIdx].setAttribute('class', 'mi');
    mirIdx = (mirIdx + 1) % ims.length;
    ims[mirIdx].setAttribute('class', 'mi on');
  }

  // Toucher court = photo suivante ; appui long (0,8 s) = fenêtre « Mes photos »
  (function () {
    var mir = $('pframe'), lt = null, longDone = false, moved = false;
    function startPress() { longDone = false; moved = false; clearTimeout(lt); lt = setTimeout(function () { longDone = true; photoManager(); }, 800); }
    function endPress() { clearTimeout(lt); }
    mir.addEventListener('touchstart', startPress, false);
    mir.addEventListener('touchmove', function () { moved = true; endPress(); }, false);
    mir.addEventListener('touchend', endPress, false);
    mir.addEventListener('mousedown', startPress, false);
    mir.addEventListener('mouseup', endPress, false);
    mir.addEventListener('contextmenu', function (e) { e.preventDefault(); }, false);
    mir.onclick = function () {
      if (longDone || moved) { longDone = false; moved = false; return; }
      if (!photos.length) { photoManager(); return; }
      nextPhoto();
      clearInterval(mirTimer); mirTimer = setInterval(nextPhoto, photoSpeed * 1000);
    };
  })();

  /* ---------- Fenêtre « Mes photos » ---------- */
  function photoManager() {
    var speeds = [5, 8, 15, 30, 60], opts = '';
    each(speeds, function (v) { opts += '<option value="' + v + '"' + (v === photoSpeed ? ' selected' : '') + '>Toutes les ' + v + ' s</option>'; });
    var grid = photos.map(function (p) {
      return '<div class="pth" data-pid="' + p.id + '"><img src="' + p.crop + '" alt=""><button class="x" data-del="' + p.id + '">✕</button></div>';
    }).join('');
    openModal('<div class="sh-head"><h2>Mes photos</h2><button class="btn" data-close>Fermer</button></div>' +
      '<div style="display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center">' +
      '<span class="btn accent pick" style="margin:0;background:var(--cal);line-height:46px">+ Choisir des photos<input type="file" id="ph-file" accept="image/*" multiple></span>' +
      '<select class="inp" id="ph-speed" style="width:200px;margin-left:12px">' + opts + '</select></div>' +
      '<div class="help">Les photos choisies sont recadrées une par une pour le miroir. Touche une photo ci-dessous pour la <b>recadrer</b>, ou ✕ pour la retirer.' +
      (PStore.local() ? '<br>⚠️ Mémoire limitée sur cet iPad : une trentaine de photos au maximum.' : '') + '</div>' +
      '<h3>Dans le miroir (' + photos.length + ')</h3>' +
      (grid ? '<div class="pgrid" id="ph-grid">' + grid + '</div>' : '<div class="ag-empty">Aucune photo pour l’instant.</div>'));
    $('ph-speed').onchange = function () { photoSpeed = +this.value; save('photoSpeed', photoSpeed); renderMirror(); };
    $('ph-file').onchange = function () {
      var files = [], fl = this.files;
      for (var i = 0; i < fl.length; i++) files.push(fl[i]);
      if (!files.length) return;
      toast('Préparation de ' + files.length + ' photo' + (files.length > 1 ? 's' : '') + '…');
      var out = [];
      (function next(i) {
        if (i >= files.length) { if (out.length) openCrop(out); else toast('Impossible de lire ces photos'); return; }
        readPhoto(files[i], function (src) { if (src) out.push({ id: uid(), src: src, added: Date.now() + i, isNew: true }); next(i + 1); });
      })(0);
    };
    var g = $('ph-grid');
    if (g) g.onclick = function (e) {
      var d = up(e.target, '[data-del]');
      if (d) {
        if (!confirm('Retirer cette photo du miroir ?')) return;
        var id = d.getAttribute('data-del');
        photos = photos.filter(function (p) { return p.id !== id; });
        PStore.del(id); renderMirror(); photoManager();
        return;
      }
      var t = up(e.target, '[data-pid]');
      if (t) { var pid = t.getAttribute('data-pid'); each(photos, function (p) { if (p.id === pid) openCrop([p]); }); }
    };
  }

  /* ---------- Recadrage ---------- */
  var CBW = 250, CBH = 500, CARCH = 'M6 494V126Q6 48 125 6Q244 48 244 126V494Z';
  var cq = [], cqi = 0, cimg = null, cst = null;
  function openCrop(list) {
    cq = list; cqi = 0;
    openModal('<div class="sh-head"><h2>Recadrer la photo</h2><button class="btn" id="cr-cancel">Annuler</button></div>' +
      '<div class="cropwrap"><div class="cropbox" id="cr-box"><img id="cr-img" alt="">' +
      '<svg viewBox="0 0 250 500"><path fill="rgba(248,244,238,.88)" fill-rule="evenodd" d="M0 0H250V500H0Z ' + CARCH + '"/>' +
      '<path d="' + CARCH + '" fill="none" stroke="#b38a4e" stroke-width="5"/></svg></div>' +
      '<div class="cropside"><div class="step" id="cr-step"></div>' +
      '<p>Fais glisser la photo avec le doigt pour choisir ce qui apparaîtra dans le miroir. Utilise + et − pour zoomer.</p>' +
      '<div class="zrow"><button class="btn" id="cr-out">−</button><button class="btn" id="cr-in">+</button><span id="cr-z"></span></div>' +
      '<button class="btn blk" id="cr-center">Centrer automatiquement</button>' +
      '<button class="btn accent blk" id="cr-ok" style="background:var(--cal)">Valider cette photo</button>' +
      '<div class="thumbs" id="cr-thumbs"></div></div></div>');
    $('cr-cancel').onclick = function () { cropFinish(); };
    $('cr-in').onclick = function () { cropZoom(1.2); };
    $('cr-out').onclick = function () { cropZoom(1 / 1.2); };
    $('cr-center').onclick = function () { cst.z = 1; cropCenter(); cropDraw(); };
    $('cr-ok').onclick = cropValidate;
    cropBindDrag($('cr-box'));
    cropLoad();
  }
  function cropLoad() {
    cimg = $('cr-img');
    cimg.onload = function () {
      var w = cimg.naturalWidth, h = cimg.naturalHeight;
      cst = { w: w, h: h, base: Math.max(CBW / w, CBH / h), z: 1, x: 0, y: 0 };
      cropCenter(); cropDraw();
    };
    cimg.src = cq[cqi].src || cq[cqi].crop;
    $('cr-step').textContent = 'Photo ' + (cqi + 1) + ' sur ' + cq.length;
    var t = '';
    for (var i = 0; i < cq.length; i++) t += '<img src="' + (cq[i].done ? cq[i].crop : (cq[i].src || cq[i].crop)) + '" class="' + (i === cqi ? 'cur' : cq[i].done ? 'done' : '') + '">';
    $('cr-thumbs').innerHTML = t;
  }
  function cropScale() { return cst.base * cst.z; }
  function cropCenter() { var s = cropScale(); cst.x = (CBW - cst.w * s) / 2; cst.y = (CBH - cst.h * s) / 2; }
  function cropDraw() {
    var s = cropScale();
    cst.x = Math.min(0, Math.max(CBW - cst.w * s, cst.x));
    cst.y = Math.min(0, Math.max(CBH - cst.h * s, cst.y));
    cimg.style.width = cst.w + 'px'; cimg.style.height = cst.h + 'px';
    var tr = 'translate(' + cst.x + 'px,' + cst.y + 'px) scale(' + s + ')';
    cimg.style.webkitTransform = tr; cimg.style.transform = tr;
    $('cr-z').textContent = 'zoom ×' + cst.z.toFixed(1);
  }
  function cropZoom(f) {
    var cx = CBW / 2, cy = CBH / 2, s0 = cropScale();
    cst.z = Math.max(1, Math.min(4, cst.z * f));
    var s1 = cropScale();
    cst.x = cx - (cx - cst.x) * s1 / s0; cst.y = cy - (cy - cst.y) * s1 / s0;
    cropDraw();
  }
  function cropBindDrag(box) {
    var sx, sy, ox, oy, on = false;
    function start(x, y) { if (!cst) return; on = true; sx = x; sy = y; ox = cst.x; oy = cst.y; }
    function move(x, y) { if (!on) return; cst.x = ox + x - sx; cst.y = oy + y - sy; cropDraw(); }
    box.addEventListener('touchstart', function (e) { var t = e.touches[0]; start(t.clientX, t.clientY); e.preventDefault(); }, false);
    box.addEventListener('touchmove', function (e) { var t = e.touches[0]; move(t.clientX, t.clientY); e.preventDefault(); }, false);
    box.addEventListener('touchend', function () { on = false; }, false);
    box.addEventListener('mousedown', function (e) { start(e.clientX, e.clientY); e.preventDefault(); }, false);
    box.addEventListener('mousemove', function (e) { move(e.clientX, e.clientY); }, false);
    box.addEventListener('mouseup', function () { on = false; }, false);
    box.addEventListener('mouseleave', function () { on = false; }, false);
  }
  function cropValidate() {
    if (!cst) return;
    var c = document.createElement('canvas'), s = cropScale();
    c.width = 240; c.height = 480;
    c.getContext('2d').drawImage(cimg, -cst.x / s, -cst.y / s, CBW / s, CBH / s, 0, 0, 240, 480);
    var p = cq[cqi];
    p.crop = c.toDataURL('image/jpeg', 0.82); p.done = true;
    if (p.isNew) { delete p.isNew; photos.push(p); }
    var rec = { id: p.id, src: p.src, crop: p.crop, added: p.added };
    PStore.put(rec);
    if (cqi < cq.length - 1) { cqi++; cropLoad(); } else cropFinish();
  }
  function cropFinish() {
    each(cq, function (p) { delete p.done; delete p.isNew; });
    renderMirror();
    photoManager();
  }

  PStore.loadAll(function (list) {
    photos = (list || []).filter(function (p) { return p && p.crop; }).sort(function (a, b) { return a.added - b.added; });
    renderMirror();
  });

  /* ---------- Démarrage ---------- */
  var lastMinute = -1;
  setInterval(function () {
    var d = new Date();
    if (d.getMinutes() === lastMinute) return;
    lastMinute = d.getMinutes();
    renderClock();
    if (current === 'home') { renderHomeAgenda(); updateTiles(); }
    if (current === 'cal' && calCfg.mode !== 'google') renderCal(false);
    if (lastMinute % 15 === 0) calFetchAll();
  }, 1000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) { tick(); calFetchAll(); } });

  calFromCache();
  renderClock();
  renderHomeAgenda();
  updateTiles();
  updateTimerBar();
  checkAlarm();
  calFetchAll();
})();
</script>
