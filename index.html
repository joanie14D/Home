<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Maison">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Maison</title>
<style>
:root{--bg:#efe8e0;--panel:#f8f4ee;--panel2:#e8dfd4;--line:#e0d5c8;--text:#3a322b;--muted:#8f8174;--ink:#26221f;--cal:#5b7577;--light:#c48a57;--rec:#869478;--tim:#c27458;--acc:#5b7577;--serif:Georgia,"Times New Roman",serif;--type:"American Typewriter","Courier New",Courier,monospace}
*{box-sizing:border-box;-webkit-tap-highlight-color:rgba(0,0,0,0)}
html,body{margin:0;height:100%;overflow:hidden;background:#efe8e0;background:var(--bg);color:var(--text);font-family:-apple-system,"Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%}
input,textarea,select,pre,.sel{-webkit-user-select:text;user-select:text}
button{font-family:inherit;cursor:pointer;-webkit-appearance:none;touch-action:manipulation}
h1,h2,h3{margin:0;font-weight:600}
h1,h2{font-family:var(--serif);font-weight:400}
.view{position:fixed;top:0;left:0;right:0;bottom:0;display:none;background:var(--bg)}
.view.on{display:block}
body.standalone .view{top:20px}
#v-cal{--acc:var(--cal)} #v-lights{--acc:var(--light)} #v-rec{--acc:var(--rec)} #v-timer{--acc:var(--tim)}
.blobs{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none}

/* Barre du haut */
.bar{position:absolute;top:0;left:0;right:0;height:64px;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;padding:0 12px;background:var(--panel);border-bottom:1px solid var(--line)}
.bar .title{-webkit-flex:1;flex:1;font-family:var(--serif);font-size:25px;margin-left:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .title small{font-family:var(--type);font-size:14px;color:var(--muted);margin-left:10px}
.vbody{position:absolute;top:64px;left:0;right:0;bottom:0;overflow:hidden}
.btn{background:var(--panel2);color:var(--text);border:0;border-radius:14px;font-size:18px;padding:0 18px;height:46px;margin-left:8px;line-height:46px;white-space:nowrap}
.btn:active,.tile:active,.lbtn:active,.preset:active{opacity:.55}
.btn.accent{background:var(--acc);color:#fff;font-weight:600}
.btn.ghost{background:transparent;color:var(--muted)}
.btn.danger{background:#f1dcd3;color:#a8503a}
.btn.back{margin-left:0;color:var(--acc);background:transparent;font-size:20px;padding:0 10px;font-family:var(--type)}
.btn.sq{width:46px;padding:0;text-align:center;font-size:24px}
.status{font-family:var(--type);font-size:13px;color:var(--muted);margin:0 6px;max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.status.err{color:#a8503a}

/* Accueil */
.home-left{position:absolute;top:34px;left:40px;width:384px;bottom:30px;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column}
.clock{font-size:84px;font-weight:300;letter-spacing:-2px;line-height:1;color:var(--text)}
.date{font-size:25px;color:#6d6156;margin-top:6px}
.widget{background:rgba(232,223,212,.92);border-radius:28px;margin-top:22px;padding:16px 18px;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center}
.aclock{width:150px;height:150px;-webkit-flex:none;flex:none}
.mcal{-webkit-flex:1;flex:1;margin-left:12px}
.mcal .mt{font-family:var(--serif);font-weight:700;font-size:17px;letter-spacing:1px;text-align:right;text-transform:uppercase;margin-bottom:4px}
.mcal table{width:100%;border-collapse:collapse;font-family:var(--serif);font-size:14px;font-weight:700}
.mcal td{text-align:center;height:20px;padding:0;position:relative}
.mcal td.wd{font-family:var(--type);font-weight:400;font-size:11px;color:var(--muted)}
.mcal td.td span{background:var(--ink);color:#fff;border-radius:5px;padding:1px 3px}
.mcal td.hasev:after{content:"";position:absolute;left:50%;bottom:0;width:4px;height:4px;margin-left:-2px;border-radius:2px;background:var(--tim)}
.agenda{background:rgba(248,244,238,.94);border-radius:28px;padding:14px 22px;margin-top:16px;overflow:hidden;-webkit-flex:1;flex:1;min-height:0}
.agenda .ag-h{font-family:var(--type);font-size:13px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin:8px 0 4px}
.ag-row{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;padding:6px 0;font-size:18px}
.ag-row .dot{width:10px;height:10px;border-radius:5px;margin-right:12px;-webkit-flex:none;flex:none}
.ag-row .t{color:var(--muted);width:84px;-webkit-flex:none;flex:none;font-size:16px;font-family:var(--type)}
.ag-row .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ag-empty{color:var(--muted);font-size:17px;line-height:1.45;padding:4px 0}
.tiles{position:absolute;left:470px;right:34px;top:64px;display:-webkit-flex;display:flex;-webkit-justify-content:space-between;justify-content:space-between}
.tile{width:120px;text-align:center;cursor:pointer}
.tile .ic{width:112px;height:112px;margin:0 auto;border-radius:28px;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;box-shadow:0 6px 16px rgba(90,70,50,.14)}
.tile svg,.ico{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.tile .ic svg{width:58px;height:58px;stroke:#fff}
.tile .ic.white{background:#fffdfa}
.tile .ic.white svg{stroke:#b98a68}
.tile .name{font-family:var(--type);font-size:17px;margin-top:12px}
.tile .sub{font-size:13px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.quote{position:absolute;left:470px;top:290px;width:210px;height:150px;border-radius:26px;background:#6f7f78;color:#f5ede4;padding:18px 20px;font-family:var(--serif);font-style:italic;font-size:21px;line-height:1.3;box-shadow:0 6px 16px rgba(90,70,50,.12)}
.quote small{display:block;font-family:var(--type);font-style:normal;font-size:12px;margin-top:10px;opacity:.8}
.shelf{position:absolute;right:20px;bottom:24px;width:560px;height:248px}
@media (orientation:portrait){
  .home-left{width:auto;right:40px;bottom:auto;height:560px}
  .tiles{left:40px;right:40px;top:auto;bottom:330px}
  .quote{display:none}
  .shelf{left:50%;margin-left:-280px;bottom:20px}
}

/* Calendrier */
.wk-head{display:-webkit-flex;display:flex;height:60px;border-bottom:1px solid var(--line);background:var(--panel)}
.gut{width:56px;-webkit-flex:none;flex:none}
.wk-day{-webkit-flex:1;flex:1;text-align:center;padding-top:5px}
.wk-day span{display:block;font-family:var(--type);font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
.wk-day b{display:inline-block;font-family:var(--serif);font-size:23px;font-weight:700;min-width:36px;line-height:32px;border-radius:9px;padding:0 4px}
.wk-day.today span{color:var(--ink)}
.wk-day.today b{background:var(--ink);color:#fff}
.wk-ad{display:-webkit-flex;display:flex;border-bottom:1px solid var(--line);max-height:110px;overflow:hidden;background:var(--panel)}
.wk-ad .gut{font-family:var(--type);font-size:11px;color:var(--muted);text-align:right;padding:7px 8px 0 0}
.ad-col{-webkit-flex:1;flex:1;min-width:0;padding:3px;border-left:1px solid var(--line)}
.chip{font-size:13px;border-radius:7px;padding:4px 6px;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff;cursor:pointer}
.wk-scroll{position:relative;overflow-y:scroll;-webkit-overflow-scrolling:touch}
.wk-grid{display:-webkit-flex;display:flex;position:relative}
.hours{width:56px;-webkit-flex:none;flex:none;position:relative}
.hours div{position:absolute;right:8px;font-family:var(--type);font-size:11px;color:var(--muted);margin-top:-8px}
.wk-col{-webkit-flex:1;flex:1;min-width:0;position:relative;border-left:1px solid var(--line);background-image:linear-gradient(to bottom,#e2d8cc 1px,rgba(0,0,0,0) 1px);background-size:100% 46px}
.wk-col.today{background-color:rgba(255,253,249,.75)}
.ev{position:absolute;border-radius:8px;padding:3px 6px;font-size:13px;line-height:1.25;overflow:hidden;color:#fff;cursor:pointer;border:1px solid var(--bg)}
.ev b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev i{font-style:normal;opacity:.9;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.now{position:absolute;left:-1px;right:0;height:2px;background:var(--tim);z-index:5}
.now:before{content:"";position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:5px;background:var(--tim)}
.gframe{border:0;width:100%;height:100%;background:#fff}
.empty{text-align:center;padding:50px 60px;color:var(--muted);font-size:20px;line-height:1.5}
.empty b{color:var(--text);font-family:var(--serif);font-weight:400;font-size:30px;display:block;margin-bottom:10px}
.empty .btn{margin-top:22px}
.empty svg{width:380px;height:170px;display:block;margin:0 auto 20px}

/* Lumières */
.lgrid{position:absolute;top:0;left:0;right:0;bottom:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:18px;display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;-webkit-align-content:flex-start;align-content:flex-start}
.lcard{width:23%;width:calc(25% - 16px);margin:8px;background:var(--panel);border-radius:28px;padding:22px 16px 16px;text-align:center;box-shadow:0 4px 14px rgba(90,70,50,.07)}
.lcard.lit{background:radial-gradient(circle at 50% 28%,rgba(232,170,110,.42),#f8f4ee 64%)}
.lcard svg{width:76px;height:76px;stroke:#b6a899}
.lcard.lit svg{stroke:var(--light);fill:rgba(232,170,110,.35)}
.lcard.scene svg{stroke:var(--cal)}
.lcard .ln{font-family:var(--serif);font-size:23px;margin:8px 0 14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow{display:-webkit-flex;display:flex}
.lbtn{-webkit-flex:1;flex:1;height:58px;border:0;border-radius:16px;font-size:17px;background:var(--panel2);color:var(--text);margin:0 4px;font-family:var(--type)}
.lbtn.on{background:var(--light);color:#fff;font-weight:600}
.lcard.scene .lbtn.on{background:var(--cal)}
.lnote{width:100%;color:var(--muted);font-size:15px;padding:10px 12px 0;line-height:1.5}

/* Recettes */
.rec-side{position:absolute;left:0;top:0;bottom:0;width:320px;background:var(--panel);border-right:1px solid var(--line)}
.rs-top{position:absolute;top:0;left:0;right:0;height:124px;padding:14px 14px 0}
.search{width:100%;height:46px;border-radius:14px;border:0;background:var(--panel2);color:var(--text);font-size:18px;padding:0 14px;-webkit-appearance:none}
.chips{white-space:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;margin-top:12px;padding-bottom:8px}
.cchip{display:inline-block;padding:0 14px;height:38px;line-height:38px;border-radius:19px;background:var(--panel2);font-size:15px;margin-right:6px;cursor:pointer;font-family:var(--type)}
.cchip.on{background:var(--rec);color:#fff}
.rs-list{position:absolute;top:124px;bottom:78px;left:0;right:0;overflow-y:auto;-webkit-overflow-scrolling:touch;border-top:1px solid var(--line)}
.ritem{padding:14px 18px;border-bottom:1px solid var(--line);cursor:pointer}
.ritem.on{background:#eef0e8;box-shadow:inset 4px 0 0 var(--rec)}
.ritem b{display:block;font-family:var(--serif);font-size:20px;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ritem span{font-size:13px;color:var(--muted);font-family:var(--type)}
.rs-bot{position:absolute;bottom:0;left:0;right:0;height:78px;padding:16px 14px;border-top:1px solid var(--line);display:-webkit-flex;display:flex}
.rs-bot .btn{margin:0 4px;-webkit-flex:1;flex:1;padding:0 8px}
.rec-main{position:absolute;left:320px;right:0;top:0;bottom:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:26px 34px 60px}
.rd-head{display:-webkit-flex;display:flex;-webkit-align-items:flex-start;align-items:flex-start}
.rd-head>div:first-child{-webkit-flex:1;flex:1}
.rd-cat{color:var(--rec);text-transform:uppercase;letter-spacing:1.5px;font-size:13px;font-family:var(--type)}
.rd-head h1{font-size:40px;margin:4px 0 8px;line-height:1.1}
.rd-meta{color:var(--muted);font-size:17px;font-family:var(--type)}
.rd-meta span{margin-right:20px;display:inline-block}
.rd-cols{display:-webkit-flex;display:flex;margin-top:24px}
.rd-ing{width:38%;padding-right:26px}
.rd-steps{-webkit-flex:1;flex:1}
.rd-cols h3,.rd-notes h3{font-family:var(--type);font-weight:400;font-size:14px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin-bottom:10px}
.rd-ing ul,.rd-steps ol{list-style:none;margin:0;padding:0}
.rd-ing li{font-size:19px;padding:10px 0 10px 40px;position:relative;border-bottom:1px solid var(--line);cursor:pointer;line-height:1.35}
.rd-ing li .box{position:absolute;left:2px;top:10px;width:26px;height:26px;border-radius:8px;border:2px solid #c9bcae;background:#fffdfa}
.rd-ing li.done{color:var(--muted);text-decoration:line-through}
.rd-ing li.done .box{background:var(--rec);border-color:var(--rec)}
.rd-steps li{font-size:19px;line-height:1.5;padding:12px 14px 12px 54px;position:relative;border-radius:16px;margin-bottom:8px;background:var(--panel);cursor:pointer}
.rd-steps li .num{position:absolute;left:12px;top:12px;width:30px;height:30px;border-radius:15px;background:var(--panel2);text-align:center;line-height:30px;font-size:16px;font-family:var(--serif);font-weight:700}
.rd-steps li.done{opacity:.45}
.rd-steps li.done .num{background:var(--rec);color:#fff}
.tlink{color:#fff;background:var(--tim);border-radius:8px;padding:1px 7px;font-weight:600;white-space:nowrap;cursor:pointer}
.tlink:before{content:"⏱ "}
.rd-notes{margin-top:26px;background:var(--panel2);border-radius:18px;padding:16px 20px;font-size:18px;line-height:1.5}
.rd-foot{margin-top:30px;text-align:right}
.form .field{margin-bottom:16px}
.field label{display:block;font-family:var(--type);font-size:13px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.field label em{text-transform:none;letter-spacing:0;font-style:normal}
.inp{width:100%;border:1px solid var(--line);border-radius:14px;background:#fffdfa;color:var(--text);font-size:18px;padding:11px 14px;font-family:inherit;-webkit-appearance:none}
textarea.inp{min-height:170px;line-height:1.45;resize:vertical}
select.inp{height:46px}
.frow{display:-webkit-flex;display:flex;margin:0 -8px}
.frow>.field{-webkit-flex:1;flex:1;margin-left:8px;margin-right:8px}

/* Minuteur */
.tm-left{position:absolute;left:0;top:0;bottom:0;width:470px;padding:18px 20px;border-right:1px solid var(--line);overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--panel)}
.tm-left h3{font-family:var(--type);font-weight:400;font-size:13px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin:6px 0 10px}
.presets{display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;margin:0 -5px 14px}
.preset{width:22%;width:calc(25% - 10px);margin:5px;height:62px;border:0;border-radius:16px;background:var(--panel2);color:var(--text);font-size:24px;font-family:var(--serif);font-weight:700}
.preset small{font-size:13px;color:var(--muted);margin-left:2px;font-family:var(--type);font-weight:400}
.cdisp{font-size:64px;font-weight:300;text-align:center;margin:4px 0 8px;letter-spacing:-1px}
.adds{display:-webkit-flex;display:flex;margin:0 -4px 10px}
.adds .btn{-webkit-flex:1;flex:1;margin:0 4px;padding:0}
.tm-right{position:absolute;left:470px;right:0;top:0;bottom:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:18px 20px}
.tcard{background:var(--panel);border-radius:26px;padding:16px 20px 18px;margin-bottom:14px;position:relative;overflow:hidden;box-shadow:0 4px 14px rgba(90,70,50,.07)}
.tcard .tl{font-family:var(--type);font-size:18px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:60px}
.tcard .big{font-size:64px;font-weight:300;line-height:1.1;letter-spacing:-1px}
.tcard.paused .big{color:var(--muted)}
.tcard.rang{background:#f3ddd3}
.tcard.rang .big{color:#a8503a}
.pbar{height:6px;border-radius:3px;background:var(--panel2);margin:8px 0 12px;overflow:hidden}
.pbar div{height:6px;background:var(--tim);width:100%}
.trow{display:-webkit-flex;display:flex;margin:0 -4px}
.trow .btn{-webkit-flex:1;flex:1;margin:0 4px}
.tdel{position:absolute;top:12px;right:12px;margin:0}
#tbar{position:fixed;right:14px;bottom:14px;z-index:40;display:none;cursor:pointer}
#tbar .pill{display:inline-block;margin-left:8px;background:var(--ink);color:#f5ede4;border-radius:24px;padding:0 18px;height:48px;line-height:48px;font-size:18px;font-family:var(--type);box-shadow:0 6px 20px rgba(60,40,20,.25)}
#tbar .pill.rang{background:var(--tim);color:#fff}

/* Alarme */
#alarm{position:fixed;top:0;left:0;right:0;bottom:0;z-index:90;display:none;background:#c27458;color:#fff;text-align:center;padding-top:120px;-webkit-animation:flash 1.2s infinite;animation:flash 1.2s infinite}
#alarm.on{display:block}
@-webkit-keyframes flash{0%,100%{background:#c27458}50%{background:#8a4b35}}
@keyframes flash{0%,100%{background:#c27458}50%{background:#8a4b35}}
#alarm .a1{font-size:32px;opacity:.9;font-family:var(--type)}
#alarm .a2{font-size:76px;font-family:var(--serif);margin:14px 40px 50px;line-height:1.1}
#alarm .btn{height:84px;font-size:30px;padding:0 50px;border-radius:24px;margin:0 10px;background:rgba(255,255,255,.22);color:#fff}
#alarm .btn.stop{background:#fff;color:#8a4b35;font-weight:700}

/* Fenêtre modale */
#modal{position:fixed;top:0;left:0;right:0;bottom:0;z-index:60;background:rgba(58,50,43,.45);display:none}
#modal.on{display:block}
.sheet{position:absolute;top:30px;bottom:30px;left:50%;width:820px;margin-left:-410px;background:#f8f4ee;border-radius:28px;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:22px 26px 40px;box-shadow:0 20px 60px rgba(60,40,20,.25)}
.sh-head{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;margin-bottom:18px}
.sh-head h2{-webkit-flex:1;flex:1;font-size:27px}
.sheet h3{font-family:var(--type);font-weight:400;font-size:14px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin:22px 0 10px}
.row{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;margin-bottom:10px;background:var(--panel2);border-radius:16px;padding:8px}
.row .inp{margin-right:8px}
.row .btn{margin-left:0}
.lrow2{display:block;padding:10px}
.lrow2 .top{display:-webkit-flex;display:flex;margin-bottom:8px}
.lrow2 .inp{margin-bottom:0}
.lrow2 .urls{display:-webkit-flex;display:flex}
.lrow2 .urls .inp{-webkit-flex:1;flex:1;font-size:15px}
.seg label{display:inline-block;background:var(--panel2);border-radius:14px;padding:12px 16px;margin:0 8px 8px 0;font-size:17px}
.seg input{margin-right:8px;-webkit-transform:scale(1.3);transform:scale(1.3)}
.help{background:#efe7dd;border-radius:16px;padding:14px 18px;color:#5e5349;font-size:16px;line-height:1.55;margin-top:10px}
.help ol{margin:6px 0;padding-left:22px}
.help b{color:var(--text)}
.help pre{background:#2b2622;border-radius:10px;padding:12px;font-size:13px;overflow-x:auto;color:#f0e6da;white-space:pre}
.dtl{font-size:20px;line-height:1.6}
.dtl .muted{color:var(--muted)}

#toast{position:fixed;left:50%;bottom:30px;width:520px;margin-left:-260px;text-align:center;z-index:95;background:var(--ink);color:#f5ede4;border-radius:18px;padding:14px 18px;font-size:18px;opacity:0;-webkit-transform:translateY(20px);transform:translateY(20px);-webkit-transition:all .25s;transition:all .25s;pointer-events:none}
#toast.show{opacity:1;-webkit-transform:none;transform:none}
</style>
</head>
<body>

<!-- ============ ACCUEIL ============ -->
<div id="v-home" class="view on">
  <svg class="blobs" viewBox="0 0 1024 768" preserveAspectRatio="xMidYMid slice">
    <path fill="#e3d6c8" d="M0 0h250c40 60 30 150-10 230-30 60-40 140-120 170C70 420 20 380 0 360z"/>

  var PENSEES = ['Prends le temps, c’est lui qui donne du goût.', 'Petit à petit, l’oiseau fait son nid.', 'Cuisiner, c’est aimer avec les mains.', 'Un jour à la fois.', 'La simplicité a toujours bon goût.', 'Les petits bonheurs font les grands jours.', 'Ce qui mijote doucement est toujours meilleur.'];

  })();
  function renderMiniCal() {

  function renderHomeAgenda() {

  function updateTiles() {

    $('sub-lights').textContent = nl + ' commande' + (nl > 1 ? 's' : '');

    $('sub-timer').textContent = nt ? nt + ' en cours' : 'Aucun en cours';
  }

  /* =====================================================
     CALENDRIER (lecture d'un lien iCal / .ics)
     ===================================================== */
  var CAL_COLORS = [['#5b7577', 'Vert-de-gris'], ['#c27458', 'Terracotta'], ['#869478', 'Sauge'], ['#c99a5b', 'Caramel'], ['#8a6548', 'Noisette'], ['#c98f8a', 'Vieux rose'], ['#3a322b', 'Encre'], ['#a99484', 'Taupe']];
  var calCfg = load('cal', { mode: 'ics', sources: [{ name: 'Mon calendrier', color: '#5b7577', url: '' }], proxy: '', google: '', startHour: 7 });
  var calEvents = [];
  var calWeek = 0;
  var calShown = [];
  var HH = 46; // hauteur d'une heure en pixels

  function hasCalSources() { return calCfg.mode !== 'google' && calCfg.sources.some(function (s) { return s.url; }); }
  function cleanUrl(u) { return String(u || '').replace(/^\s+|\s+$/g, '').replace(/^webcal:\/\//i, 'https://'); }

  function getText(url, cb) {
    var x = new XMLHttpRequest(), done = false;
    function fin(err, txt) { if (!done) { done = true; cb(err, txt); } }
    try {

      x.timeout = 25000;
      x.onreadystatechange = function () {
        if (x.readyState === 4) { if (x.status >= 200 && x.status < 300) fin(null, x.responseText); else fin(new Error('HTTP ' + x.status)); }

  }

  }

  function unesc(v) { return v.replace(/\\n/gi, '\n').replace(/\\([,;\\])/g, '$1'); }

  function parseICS(txt) {

    var lines = txt.split(/\r?\n/), evs = [], cur = null, sub = 0;
    for (var i = 0; i < lines.length; i++) {
      var L = lines[i];

      if (L === 'BEGIN:VEVENT') { cur = { exdates: [] }; sub = 0; continue; }

        if (cur && cur.start) {

      }

  function expandRule(e, from, to, cb) {
    var r = {};

    var count = r.COUNT ? parseInt(r.COUNT, 10) : Infinity;
    var until = r.UNTIL ? parseDate(r.UNTIL) : null;

    var s = e.start, n = 0, guard = 0;
    var ex = {};

    var dur = Math.max(e.end - e.start, 1);
    var h = s.getHours(), mi = s.getMinutes(), se = s.getSeconds();
    var byday = r.BYDAY ? r.BYDAY.split(',') : null;
    function take(d) {
      if (d < s) return true;
      if (until && d > until) return false;
      if (n >= count) return false;
      if (d >= to) return false;

  function calInstances(from, to) {
    var out = [], overrides = {};

    each(calEvents, function (e) {
      if (e.status === 'CANCELLED') return;
      var mk = function (s) {
        var end;

        return { title: e.title || '(sans titre)', loc: e.loc || '', start: s, end: end, allDay: e.allDay, color: e.color, cal: e.cal };
      };
      if (!e.rrule || e.recurId) {
        if (e.end > from && e.start < to) out.push(mk(e.start));

    each(timers, function (t) {
      var r = tRemain(t);
      if (r <= 0 && !t.rang && !t.paused) { t.rang = true; changed = true; }
      var el = $('tm-' + t.id); if (el) el.textContent = t.rang ? 'Terminé !' : fmt(r);
      var pb = $('tp-' + t.id); if (pb) pb.style.width = Math.max(0, Math.min(100, r / t.total * 100)) + '%';
      var bt = $('tbt-' + t.id); if (bt) bt.textContent = t.rang ? 'fini' : fmt(r);
    });
    if (changed) { saveTimers(); renderTimers(); updateTimerBar(); checkAlarm(); }
  }
  setInterval(tick, 250);

  /* ---------- Démarrage ---------- */
  var lastMinute = -1;
  setInterval(function () {
    var d = new Date();
    if (d.getMinutes() === lastMinute) return;
    lastMinute = d.getMinutes();
    renderClock();
    if (current === 'home') { renderHomeAgenda(); updateTiles(); }
    if (current === 'cal' && calCfg.mode !== 'google') renderCal(false);
    if (lastMinute % 15 === 0) calFetchAll();
  }, 1000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) { tick(); calFetchAll(); } });

  calFromCache();
  renderClock();
  renderHomeAgenda();
  updateTiles();
  updateTimerBar();
  checkAlarm();
  calFetchAll();
})();
</script>
</body>
</html>
